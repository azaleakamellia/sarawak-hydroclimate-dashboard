name: hydro-ml
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core Python ---
  - python=3.11
  - pip
  - jupyterlab
  - ipykernel

  # --- Geospatial & Earth Observation ---
  - earthengine-api     # Google Earth Engine Python API
  - geopandas           # Vector data / Shapefiles
  - xarray              # N-dimensonal arrays (NetCDF/GRIB)
  - rioxarray           # Xarray extension for geospatial rasters
  - rasterio            # Reading/writing GeoTIFFs
  - shapely             # Geometry operations
  - fiona               # GIS file format support
  - xee                 # (Pro-Tip) Xarray backend for GEE

  # --- Data Science & Math (SPI/SPEI Gamma Distributions) ---
  - pandas
  - numpy
  - scipy
  - pyarrow             # Required for saving compact Parquet files

  # --- Machine Learning & Explainable AI (xAI) ---
  - scikit-learn        # RF, GBM, SVM, Linear Models
  - xgboost             # Advanced Gradient Boosting
  - shap                # SHAP values for model explainability

  # --- Visualization & Dashboard ---
  - matplotlib
  - seaborn
  - plotly
  - streamlit           # For the interactive web dashboard
  - folium              # Interactive leaflet maps

  # --- Optional: Deep Learning (for LSTM/GRU forecasting later) ---
  # - pytorch
  # - tensorflow